<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050507" />
    <meta
      name="description"
      content="Watson Movies — Discover movies worth watching. Cinematic violet experience."
    />
    <meta
      name="keywords"
      content="Watson Movies, movies, films, watch movies, movie discovery, cinema, violet"
    />
    <meta name="author" content="Watson Movies" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />

    <!-- Cinematic Fonts - Sora + DM Sans (NOT Bebas) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon violet -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />

    <title>Watson Movies 🎬 — Cinematic</title>

    <style>
      /* Prevent white flash before React loads */
      html, body {
        background: #050507;
        margin: 0;
      }
      #root {
        min-height: 100vh;
        background: 
          radial-gradient(ellipse at 0% 0%, rgba(139,92,246,0.15) 0%, transparent 50%),
          radial-gradient(ellipse at 100% 100%, rgba(59,130,246,0.1) 0%, transparent 50%),
          #050507;
      }
      /* Loading pulse */
      #root:empty::after {
        content: 'Watson Movies';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Sora', sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.5px;
        color: rgba(255,255,255,0.3);
        animation: pulse 1.5s ease infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.6; } }
    </style>
  </head>
  <body>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050507;color:#fff;font-family:sans-serif;text-align:center;padding:20px">
        <div>
          <h1 style="font-size:32px;margin-bottom:12px">Watson Movies 🎬</h1>
          <p>You need to enable JavaScript to use Watson Movies.</p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
